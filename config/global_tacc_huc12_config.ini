
# ------- Files needed to prepare runs -------------
[datasource]

#url_huc12 = https://web.corral.tacc.utexas.edu/ras2fim/huc12/huc12_texas_ar_5070.fgb
#vrt_terrain = /app/lisflood2fim/data_in/texas_cog_3m_statewide.vrt
#url_roads =  https://web.corral.tacc.utexas.edu/ras2fim/road_lines/TX_public_road_ln_4326_20250317.fgb
#url_precip_intensity_by_return_period = https://web.corral.tacc.utexas.edu/ras2fim/precip/tx_precip_intensity_by_return_period.tif
#url_precip_intensity_by_duration = https://web.corral.tacc.utexas.edu/ras2fim/precip/tx_precip_intensity_by_duration.tif
#url_nlcd_mannings = https://web.corral.tacc.utexas.edu/ras2fim/nlcd/ManningsN_Texas_2023_COG.tif

url_huc12 = /work2/08140/acarter/stampede3/web/huc12/huc12_texas_ar_5070.fgb
vrt_terrain = /work2/08140/acarter/stampede3/web/texas_cog_3m_statewide.vrt
url_roads =  /work2/08140/acarter/stampede3/web/road_lines/TX_public_road_ln_4326_20250317.fgb
url_precip_intensity_by_return_period = /work2/08140/acarter/stampede3/web/precip/tx_precip_intensity_by_return_period.tif
url_precip_intensity_by_duration      = /work2/08140/acarter/stampede3/web/precip/tx_precip_intensity_by_duration.tif
url_nlcd_mannings = /work2/08140/acarter/stampede3/web/nlcd/ManningsN_Texas_2023_COG.tif

# -----------------------
[lisflood_settings]
# 1= original terrain, 2= 1/4th the pixels, 3=1/9th the pixels
downscale = 8

terrain_buffer_m = 50

## Constants for LisFLOOD paramter config file
# Mannings roughness
fpfric = 0.06

# Number of low intensity runs to use default Mannings N
default_manning_runs = 3

# Inital timestep in seconds
initial_tstep = 1.0

# Min depth in meters
depththresh = 0.001

max_Froude = 1.0

# slope of outflow boundary condition cells
outflow_boundary_slope = 0.01

# distance where stream inflow not considred 'lateral inflow'
perct_bottom_line = 0.05
perct_top_line = 0.95

# draiange area where a stream starts
stream_threshold_sq_mi = 0.10

# -----------------------
[flow_parameters]
# number of log flow/intensity steps
num_steps = 15

# number of hours to run each intensity simulation
timesteps = 20

# how long (in hours) before output raster is written
output_step = 20

# how long (in hours) before a mass balance calcualtion is made
mass_balance_step = 0.1

# -----------------------
[stable_run_paramters]
# rolling average window of runs
window = 3

# percentage of Q-expected to Q-actual that is OK
min_Qout_ratio = 0.80

# percentage of Q-expected to Q-actual that is OK
max_Qout_ratio = 1.20

# relative change of Qout on rolling average that is OK
max_rolling_avg_stability = 0.002

# number of lowest-intensity runs that may be accepted without passing
# the stability check (the last row of the .mass file is used); an
# unstable run after these stops the series
num_unchecked_runs = 3

# -----------------------
[clean_fim_stack]

# minimum depth of flood inundation to retain
min_depth_threshold_inches = 3.0

# from D8 connectivity, min number of pixels in disconnected group that is still valid
min_connected_pixels = 15

# -----------------------
[whitebox]
# WhiteboxTools can fail intermittently (e.g. exit status 101);
# each Whitebox step is retried up to this many times
max_attempts = 5

# seconds to wait before a retry; grows each attempt (5, 10, 15 ...)
retry_wait_sec = 5

# -----------------------
[lisflood_timeouts]
# Limits on LISFLOOD run time.  Set any value to 0 to turn that limit off.

# longest sim_time (hours) for any run; keeps an unstable run from making
# each later run 1.5 hours longer than the one before
max_sim_time_hr = 20

# simulated time (hours) added past the stable time for the next run
stable_buffer_hr = 1.5

# wall-clock budget (minutes) per run: sim_time is shortened to what fits,
# using the speed of the previous run
max_run_wall_min = 0

# the wall-clock budget never cuts sim_time below this (hours)
min_sim_time_hr = 6

# kill a run that passes this many minutes; the series stops there
hard_timeout_min = 120

# retry = re-run an unstable run once from the previous run's depths, then
#         use startfiles from there on (original behavior)
# always = every run after the first starts from the previous run's depths
# never = no startfiles, no retry
startfile_mode = retry
